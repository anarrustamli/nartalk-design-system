<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css"><style>html,body{margin:0}body{width:1280px;height:854px;display:grid;grid-template-columns:1fr 300px;overflow:hidden}.main{background:var(--nar-500);display:grid;place-items:center;gap:0}.mark{display:flex;align-items:center;gap:44px}.mark img{width:250px;height:250px;display:block}.name{font-family:var(--font-sans);font-weight:600;font-size:150px;letter-spacing:-.045em;color:#fff;line-height:1;white-space:nowrap}.strip{display:grid;grid-template-rows:repeat(4,1fr)}.strip div{width:100%;height:100%}</style></head><body><div class="main"><div class="mark"><img src="assets/logo-mark-white.png" alt=""><div class="name">NarTalk</div></div></div><div class="strip"><div style="background:var(--amber-400)"></div><div style="background:var(--emerald-500)"></div><div style="background:var(--azure-600)"></div><div style="background:var(--ink-900)"></div></div></body></html>
