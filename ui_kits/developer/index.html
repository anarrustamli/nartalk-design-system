<!DOCTYPE html><html lang="az"><head><meta charset="utf-8"><title>NarTalk — Developer</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body,#root{height:100%;margin:0}</style></head>
<body><div id="root"></div>
<script type="text/babel" src="../dashboard/Shell.jsx"></script>
<script type="text/babel" src="DevScreens.jsx"></script>
<script type="text/babel">
const CRUMBS = {
  apikeys: [{ label: "Acme Workspace" }, { label: "Developer" }, { label: "API açarları" }],
  webhooks: [{ label: "Acme Workspace" }, { label: "Developer" }, { label: "Webhook-lar" }],
  otp: [{ label: "Acme Workspace" }, { label: "Developer" }, { label: "OTP" }],
  team: [{ label: "Acme Workspace" }, { label: "Komanda" }],
};
function App() {
  const [route, setRoute] = React.useState("apikeys");
  const [dark, setDark] = React.useState(false);
  const [collapsed, setCollapsed] = React.useState(false);
  React.useEffect(() => { document.documentElement.classList.toggle("dark", dark); }, [dark]);
  const go = (r) => { if (["apikeys","webhooks","otp","team"].includes(r)) setRoute(r); else window.location.href = "../dashboard/index.html"; };
  return (
    <AppShell route={route} onRoute={go} crumbs={CRUMBS[route]} dark={dark} onDark={() => setDark(!dark)}
      collapsed={collapsed} onCollapse={() => setCollapsed(!collapsed)}>
      {route === "apikeys" ? <ApiKeys /> : route === "webhooks" ? <Webhooks /> : route === "otp" ? <Otp /> : <Team />}
    </AppShell>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script></body></html>
