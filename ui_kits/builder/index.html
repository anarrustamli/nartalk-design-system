<body><div id="root"></div>

<script type="text/babel" src="BotBuilder.jsx"></script>
<script type="text/babel" src="FormBuilder.jsx"></script>
<script type="text/babel">
const { Button, IconButton, SegmentedControl, Badge } = window.NarTalkDesignSystem_3e1107;

function App() {
  const [which, setWhich] = React.useState("bot");
  const [dark, setDark] = React.useState(false);
  const [collapsed, setCollapsed] = React.useState(true);
  React.useEffect(() => { document.documentElement.classList.toggle("dark", dark); }, [dark]);
  return (
    <AppShell route={which === "bot" ? "bots" : "forms"} onRoute={(r) => setWhich(r === "forms" ? "form" : "bot")}
      crumbs={which === "bot"
        ? [{ label: "Acme Workspace" }, { label: "Botlarım", href: "../dashboard/index.html" }, { label: "Müştəri müraciətləri" }]
        : [{ label: "Acme Workspace" }, { label: "Formalar" }, { label: "Müştəri müraciəti" }]}
      dark={dark} onDark={() => setDark(!dark)} collapsed={collapsed} onCollapse={() => setCollapsed(!collapsed)}
      padded={false}
      actions={<SegmentedControl value={which} onChange={setWhich} options={[{ value: "bot", label: "Bot qurucusu", icon: "Bot" }, { value: "form", label: "Forma qurucusu", icon: "ClipboardList" }]} />}>
      {which === "bot" ? <BotBuilder /> : <FormBuilder />}
    </AppShell>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script></body></html>
